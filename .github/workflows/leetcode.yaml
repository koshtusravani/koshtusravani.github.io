# Refreshes leetcode.json and github.json every 6 hours so the portfolio shows current stats.
name: Update portfolio stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch LeetCode stats
        continue-on-error: true
        run: python .github/scripts/fetch_leetcode.py

      - name: Fetch GitHub stats
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/fetch_github.py

      - name: Commit updated stats if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for f in leetcode.json github.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "No changes in stats"
          else
            git commit -m "Update portfolio stats"
            git push
          fi