# Refreshes leetcode.json every 6 hours so the portfolio shows current LeetCode stats.
name: Update LeetCode stats

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch LeetCode stats
        run: python .github/scripts/fetch_leetcode.py

      - name: Commit updated stats if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add leetcode.json
          if git diff --staged --quiet; then
            echo "No changes in LeetCode stats"
          else
            git commit -m "Update LeetCode stats"
            git push
          fi